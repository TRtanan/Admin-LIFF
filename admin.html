<!doctype html>
<html lang="th">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>E-CHA Admin</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  color:#1f2937;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:12px;
}

.brand{
  font-size:24px;
  font-weight:700;
}

.user-info{
  text-align:right;
}

.role{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:#e5e7eb;
  font-size:12px;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px #0000000d;
}

.num{
  font-size:28px;
  font-weight:700;
  margin-top:6px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0;
}

.nav button,
.action{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#111827;
  color:white;
  cursor:pointer;
  font-size:14px;
}

.nav button.secondary{
  background:#e5e7eb;
  color:#111827;
}

.nav button:hover,
.action:hover{
  opacity:.9;
}

.section{
  margin-top:16px;
}

.hidden{
  display:none !important;
}

.tablewrap{
  overflow:auto;
  background:#fff;
  border-radius:14px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap;
}

.table th{
  background:#f9fafb;
  font-weight:700;
}

.muted{
  color:#6b7280;
  font-size:13px;
  margin-bottom:8px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.loading{
  background:#fef3c7;
  color:#92400e;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
}

.info-box{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin:12px 0;
  box-shadow:0 1px 5px #0000000d;
}

.period-status{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  background:#e5e7eb;
}

select,
input{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  font-size:14px;
}

.button-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.danger{
  background:#991b1b !important;
}

.warning{
  background:#92400e !important;
}

.green{
  background:#047857 !important;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:500px){

  .wrap{
    padding:12px;
  }

  .brand{
    font-size:21px;
  }

  .top{
    align-items:flex-start;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .card{
    padding:12px;
  }

  .num{
    font-size:24px;
  }

  .nav button,
  .action{
    padding:9px 11px;
  }

}

</style>

</head>


<body>

<script>


/* =====================================================
   CONFIG
   ===================================================== */

const CONFIG = {

  LIFF_ID:
    '2011734616-wit93kJp',

  API_URL:
    'https://script.google.com/macros/s/AKfycbyBPYGNYSEEGkAGhIAzLBHXsEukhJR8QRfphmuR9pVdiOgt3V909tbePSuMuSFlCLUHJw/exec'

};



/* =====================================================
   GLOBAL
   ===================================================== */

let idToken = '';

let role = '';

let adminName = '';



/* =====================================================
   HELPER
   ===================================================== */

const $ =
  id => document.getElementById(id);



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>"']/g,

    char => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[char])

  );

}



/* =====================================================
   MESSAGE
   ===================================================== */

function clearMessage(){

  $('error').innerHTML = '';

}


function showError(message){

  $('error').innerHTML =

    '<div class="error">' +

    esc(message) +

    '</div>';

}


function showSuccess(message){

  $('error').innerHTML =

    '<div class="success">' +

    esc(message) +

    '</div>';

}


function showLoading(message){

  $('error').innerHTML =

    '<div class="loading">' +

    esc(
      message ||
      'กำลังโหลด...'
    ) +

    '</div>';

}



/* =====================================================
   BANGKOK DATE
   ===================================================== */

function getBangkokDate(){

  try{

    const formatter =
      new Intl.DateTimeFormat(
        'en-CA',
        {
          timeZone:
            'Asia/Bangkok',

          year:
            'numeric',

          month:
            '2-digit',

          day:
            '2-digit'
        }
      );

    return formatter.format(
      new Date()
    );

  }catch(error){

    /*
      Fallback
    */

    const now =
      new Date();

    const y =
      now.getFullYear();

    const m =
      String(
        now.getMonth()+1
      ).padStart(
        2,
        '0'
      );

    const d =
      String(
        now.getDate()
      ).padStart(
        2,
        '0'
      );

    return `${y}-${m}-${d}`;

  }

}



/* =====================================================
   INIT
   ===================================================== */

async function init(){

  try{

    clearMessage();


    /* -----------------------------------------------
       CHECK CONFIG
       ----------------------------------------------- */

    if(
      !CONFIG.LIFF_ID ||
      CONFIG.LIFF_ID.includes(
        'PUT_'
      )
    ){

      throw new Error(
        'ยังไม่ได้ตั้ง Admin LIFF ID'
      );

    }


    if(
      !CONFIG.API_URL ||
      CONFIG.API_URL.includes(
        'PUT_'
      )
    ){

      throw new Error(
        'ยังไม่ได้ตั้ง Apps Script Web App URL'
      );

    }


    /* -----------------------------------------------
       LIFF
       ----------------------------------------------- */

    await liff.init({

      liffId:
        CONFIG.LIFF_ID

    });


    /* -----------------------------------------------
       LOGIN
       ----------------------------------------------- */

    if(
      !liff.isLoggedIn()
    ){

      liff.login();

      return;

    }


    /* -----------------------------------------------
       ID TOKEN
       ----------------------------------------------- */

    idToken =
      liff.getIDToken();


    if(!idToken){

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    /* -----------------------------------------------
       CHECK ADMIN
       ----------------------------------------------- */

    showLoading(
      'กำลังตรวจสอบสิทธิ์ Admin...'
    );


    const dashboard =
      await api(
        'DASHBOARD'
      );


    /* -----------------------------------------------
       ROLE
       ----------------------------------------------- */

    role =
      String(
        dashboard.role ||
        ''
      ).toUpperCase();


    adminName =
      dashboard.adminName ||
      dashboard.name ||
      'Admin';


    $('role').textContent =
      role || 'ADMIN';


    $('name').textContent =
      adminName;


    /* -----------------------------------------------
       ADMIN MENU
       ----------------------------------------------- */

    if(
      role !== 'SUPER_ADMIN'
    ){

      $('adminBtn')
        .style
        .display =
        'none';

    }else{

      $('adminBtn')
        .style
        .display =
        '';

    }


    /* -----------------------------------------------
       DASHBOARD
       ----------------------------------------------- */

    renderDashboard(
      dashboard.data ||
      {}
    );


    clearMessage();


    /* -----------------------------------------------
       DEFAULT DATE
       ----------------------------------------------- */

    /*
      ตั้งวันที่เฉพาะหลัง Login สำเร็จ
      และใช้ Bangkok date
    */

    const attDate =
      $('attDate');

    if(
      attDate &&
      !attDate.value
    ){

      attDate.value =
        getBangkokDate();

    }


    /* -----------------------------------------------
       DEFAULT PAGE
       ----------------------------------------------- */

    show(
      'attendance'
    );


  }catch(error){

    console.error(
      'ADMIN INIT ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   API
   ===================================================== */

async function api(
  action,
  payload = {}
){

  if(!CONFIG.API_URL){

    throw new Error(
      'ไม่พบ API URL'
    );

  }


  if(!idToken){

    throw new Error(
      'ไม่พบ LINE ID Token'
    );

  }


  const requestBody = {

    requestType:
      'admin',

    action:
      action,

    idToken:
      idToken,

    ...payload

  };


  const response =
    await fetch(
      CONFIG.API_URL,
      {

        method:
          'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(
            requestBody
          )

      }
    );


  if(!response.ok){

    throw new Error(
      'Apps Script HTTP Error ' +
      response.status
    );

  }


  const responseText =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(
        responseText
      );

  }catch(error){

    console.error(
      'INVALID JSON',
      responseText
    );

    throw new Error(
      'Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON'
    );

  }


  if(!data.ok){

    throw new Error(
      data.error ||
      'API Error'
    );

  }


  return data;

}



/* =====================================================
   DASHBOARD
   ===================================================== */

function renderDashboard(
  data
){

  $('active').textContent =
    data.activeEmployees ??
    '-';


  $('working').textContent =
    data.workingToday ??
    '-';


  $('missing').textContent =
    data.missingClockOut ??
    '-';


  $('late').textContent =
    data.lateToday ??
    '-';

}



/* =====================================================
   SECTION
   ===================================================== */

function show(id){

  document
    .querySelectorAll(
      'section'
    )
    .forEach(
      section =>
        section.classList.add(
          'hidden'
        )
    );


  const target =
    $(id);


  if(!target){

    showError(
      'ไม่พบ Section: ' +
      id
    );

    return;

  }


  target.classList.remove(
    'hidden'
  );


  /* -----------------------------------------------
     LOAD DATA
     ----------------------------------------------- */

  if(
    id === 'attendance'
  ){

    loadAttendance();

  }


  if(
    id === 'employees'
  ){

    loadEmployees();

  }


  if(
    id === 'payroll'
  ){

    loadPayrollPeriods();

  }


  if(
    id === 'audit'
  ){

    loadAudit();

  }


  if(
    id === 'admins'
  ){

    if(
      role === 'SUPER_ADMIN'
    ){

      loadAdmins();

    }else{

      showError(
        'เฉพาะ SUPER_ADMIN เท่านั้น'
      );

    }

  }

}



/* =====================================================
   ATTENDANCE
   ===================================================== */

async function loadAttendance(){

  try{

    showLoading(
      'กำลังโหลด Attendance...'
    );


    const date =
      $('attDate')
        .value
        .trim();


    /*
      ถ้ามีวันที่ → ส่ง date
      ถ้าไม่มี → Backend ใช้ default
    */

    const payload =
      date
        ? {
            date:
              date
          }
        : {};


    const d =
      await api(
        'ATTENDANCE',
        payload
      );


    $('attTable')
      .innerHTML =
      table(
        d.data ||
        [],

        [
          'employeeId',
          'name',
          'type',
          'checkIn',
          'checkOut',
          'hours',
          'basePay',
          'otHours',
          'otPay',
          'status'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'ATTENDANCE ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   EMPLOYEES
   ===================================================== */

async function loadEmployees(){

  try{

    showLoading(
      'กำลังโหลด Employees...'
    );


    const d =
      await api(
        'EMPLOYEES'
      );


    $('empTable')
      .innerHTML =
      table(
        d.data ||
        [],

        [
          'employeeId',
          'name',
          'type',
          'position',
          'salaryRate',
          'positionAllowance',
          'attendanceBonus',
          'status'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'EMPLOYEES ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   PAYROLL PERIODS
   ===================================================== */

async function loadPayrollPeriods(){

  try{

    showLoading(
      'กำลังโหลด Payroll Periods...'
    );


    const d =
      await api(
        'LIST_PAYROLL_PERIODS'
      );


    const select =
      $('period');


    select.innerHTML =
      '';


    const defaultOption =
      document.createElement(
        'option'
      );


    defaultOption.value =
      '';


    defaultOption.textContent =
      '-- เลือก Payroll Period --';


    select.appendChild(
      defaultOption
    );


    const periods =
      Array.isArray(
        d.data
      )
        ? d.data
        : [];


    periods.forEach(
      period => {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          period.periodId ||
          '';


        const periodId =
          period.periodId ||
          '';


        const startDate =
          period.startDate ||
          '';


        const endDate =
          period.endDate ||
          '';


        const status =
          period.status ||
          '';


        option.textContent =
          `${periodId} | ${startDate} - ${endDate} | ${status}`;


        /*
          เก็บข้อมูลไว้ด้วย
          เผื่อใช้แสดงรายละเอียด
        */

        option.dataset.startDate =
          startDate;


        option.dataset.endDate =
          endDate;


        option.dataset.payDate =
          period.payDate ||
          '';


        option.dataset.status =
          status;


        option.dataset.remark =
          period.remark ||
          '';


        select.appendChild(
          option
        );

      }
    );


    $('periodInfo')
      .innerHTML =
      '';


    clearMessage();


  }catch(error){

    console.error(
      'PAYROLL PERIOD ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   PERIOD CHANGE
   ===================================================== */

$('period')
  .addEventListener(
    'change',
    function(){

      const option =
        this.options[
          this.selectedIndex
        ];


      if(
        !option ||
        !option.value
      ){

        $('periodInfo')
          .innerHTML =
          '';

        return;

      }


      const status =
        option.dataset.status ||
        '';


      const statusClass =
        status === 'Paid'
          ? 'green'
          : '';


      $('periodInfo')
        .innerHTML = `

          <div class="info-box">

            <b>
              Payroll Period
            </b>

            <div style="margin-top:8px">

              <strong>
                ${esc(
                  option.value
                )}
              </strong>

            </div>

            <div
              class="muted"
              style="margin-top:6px">

              ${esc(
                option.dataset.startDate ||
                ''
              )}

              -

              ${esc(
                option.dataset.endDate ||
                ''
              )}

            </div>

            <div
              style="margin-top:8px">

              Status:

              <span
                class="period-status">

                ${esc(
                  status ||
                  '-'
                )}

              </span>

            </div>

            <div
              class="muted"
              style="margin-top:6px">

              Pay Date:

              ${esc(
                option.dataset.payDate ||
                '-'
              )}

            </div>

          </div>

        `;

    }
  );



/* =====================================================
   PAYROLL
   ===================================================== */

async function loadPayroll(){

  try{

    const period =
      $('period')
        .value
        .trim();


    if(!period){

      showError(
        'กรุณาเลือก Payroll Period'
      );

      return;

    }


    showLoading(
      'กำลังโหลด Payroll...'
    );


    const d =
      await api(
        'PAYROLL',
        {
          periodId:
            period
        }
      );


    let html =
      table(
        d.data ||
        [],

        [
          'payrollId',
          'periodId',
          'employeeId',
          'name',
          'basePay',
          'otPay',
          'holidayPay',
          'positionAllowance',
          'attendanceBonus',
          'incentive',
          'otherEarning',
          'deduction',
          'netPay',
          'status'
        ]
      );


    /*
      SUPER_ADMIN
      สามารถ Approve / Paid
    */

    if(
      role === 'SUPER_ADMIN'
    ){

      html = `

        <div
          class="info-box">

          <div
            class="button-row">

            <button
              class="action green"
              onclick="approve()">

              ✅ Approve Payroll

            </button>


            <button
              class="action"
              onclick="paid()">

              💵 Mark as Paid

            </button>

          </div>

          <div class="muted">

            เฉพาะ SUPER_ADMIN
            สามารถ Approve และ Mark as Paid

          </div>

        </div>

      ` + html;

    }


    $('payTable')
      .innerHTML =
      html;


    clearMessage();


  }catch(error){

    console.error(
      'PAYROLL ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}



/* =====================================================
   RECALCULATE PAYROLL
   ===================================================== */

async function recalculatePayroll(){

  try{

    const period =
      $('period')
        .value
        .trim();


    if(!period){

      showError(
        'กรุณาเลือก Payroll Period ก่อน Recalculate'
      );

      return;

    }


    const confirmed =
      window.confirm(
        `ต้องการ Recalculate Payroll งวด ${period} ใช่หรือไม่?`
      );


    if(!confirmed){

      return;

    }


    showLoading(
      `กำลัง Recalculate ${period}...`
    );


    const d =
      await api(
        'RECALCULATE_PAYROLL',
        {
          periodId:
            period
        }
      );


    showSuccess(
      d.message ||
      `Recalculate ${period} สำเร็จ`
    );


    await loadPayroll();


  }catch(error){

    console.error(
      'RECALCULATE ERROR',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}

/* =====================================================
   TABLE
   ===================================================== */

function table(
  rows,
  columns
){

  if(
    !Array.isArray(rows) ||
    rows.length === 0
  ){

    return `

      <div
        style="padding:16px">

        ไม่มีข้อมูล

      </div>

    `;

  }


  return `

    <table class="table">

      <thead>

        <tr>

          ${
            columns
              .map(
                column =>

                  '<th>' +
                  esc(column) +
                  '</th>'

              )
              .join('')
          }

        </tr>

      </thead>


      <tbody>

        ${
          rows
            .map(
              row => `

                <tr>

                  ${
                    columns
                      .map(
                        column =>

                          '<td>' +

                          esc(
                            row?.[column]
                          ) +

                          '</td>'

                      )
                      .join('')
                  }

                </tr>

              `
            )
            .join('')
        }

      </tbody>

    </table>

  `;

}
