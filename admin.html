<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-CHA Admin</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  color:#1f2937;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  font-size:24px;
  font-weight:700;
}

.role{
  padding:6px 10px;
  border-radius:999px;
  background:#e5e7eb;
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 10px #0000000d;
}

.num{
  font-size:28px;
  font-weight:700;
  margin-top:6px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:16px 0;
}

.nav button,
.action{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#111827;
  color:white;
  cursor:pointer;
}

.nav button.secondary{
  background:#e5e7eb;
  color:#111827;
}

.section{
  margin-top:16px;
}

.hidden{
  display:none;
}

.tablewrap{
  overflow:auto;
  background:#fff;
  border-radius:14px;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap;
}

.danger{
  color:#b91c1c;
}

.ok{
  color:#047857;
}

.muted{
  color:#6b7280;
  font-size:13px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
}

.success{
  background:#dcfce7;
  color:#166534;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
}

.loading{
  background:#fef3c7;
  color:#92400e;
  padding:10px;
  border-radius:10px;
  margin-bottom:12px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:8px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .wrap{
    padding:12px;
  }

  .brand{
    font-size:21px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
  }

  .card{
    padding:12px;
  }

  .num{
    font-size:24px;
  }

  .nav button,
  .action{
    padding:9px 12px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- MESSAGE -->
  <div id="error"></div>

  <!-- HEADER -->
  <div class="top">
    <div class="brand">E-CHA ADMIN</div>

    <div>
      <span id="name"></span>
      <span id="role" class="role">...</span>
    </div>
  </div>


  <!-- DASHBOARD -->
  <div class="grid">

    <div class="card">
      พนักงาน Active
      <div id="active" class="num">-</div>
    </div>

    <div class="card">
      ทำงานวันนี้
      <div id="working" class="num">-</div>
    </div>

    <div class="card">
      ยังไม่ Clock-out
      <div id="missing" class="num">-</div>
    </div>

    <div class="card">
      มาสายวันนี้
      <div id="late" class="num">-</div>
    </div>

  </div>


  <!-- NAVIGATION -->
  <div class="nav">

    <button onclick="show('attendance')">
      🕐 Attendance
    </button>

    <button onclick="show('employees')">
      👥 Employees
    </button>

    <button onclick="show('payroll')">
      💰 Payroll
    </button>

    <button onclick="show('audit')">
      📋 Audit Log
    </button>

    <button
      id="adminBtn"
      class="secondary"
      onclick="show('admins')">
      👑 Admins
    </button>

  </div>


  <!-- ATTENDANCE -->
  <section id="attendance" class="section hidden">

    <h2>Attendance</h2>

    <div class="muted">
      แสดง Daily_Attendance
    </div>

    <input
      id="attDate"
      type="date"
      aria-label="เลือกวันที่ Attendance"
    >

    <button
      class="action"
      onclick="loadAttendance()">
      Refresh
    </button>

    <div
      id="attTable"
      class="tablewrap"
      style="margin-top:12px">
    </div>

  </section>


  <!-- EMPLOYEES -->
  <section id="employees" class="section hidden">

    <h2>Employees</h2>

    <button
      class="action"
      onclick="loadEmployees()">
      Refresh
    </button>

    <div
      id="empTable"
      class="tablewrap"
      style="margin-top:12px">
    </div>

  </section>


  <!-- PAYROLL -->
  <section id="payroll" class="section hidden">

    <h2>Payroll</h2>

    <input
      id="period"
      type="text"
      placeholder="เช่น 2026-09-B"
      autocomplete="off"
    >

    <button
      class="action"
      onclick="loadPayroll()">
      Load
    </button>

    <div
      id="payTable"
      class="tablewrap"
      style="margin-top:12px">
    </div>

  </section>


  <!-- AUDIT -->
  <section id="audit" class="section hidden">

    <h2>Audit Log</h2>

    <button
      class="action"
      onclick="loadAudit()">
      Refresh
    </button>

    <div
      id="auditTable"
      class="tablewrap"
      style="margin-top:12px">
    </div>

  </section>


  <!-- ADMINS -->
  <section id="admins" class="section hidden">

    <h2>Admins</h2>

    <button
      class="action"
      onclick="loadAdmins()">
      Refresh
    </button>

    <div
      id="adminTable"
      class="tablewrap"
      style="margin-top:12px">
    </div>

  </section>

</div>


<script>

/* =====================================================
   CONFIG
   ===================================================== */

const CONFIG = {

  LIFF_ID:
    '2011734616-wit93kJp',

  API_URL:
    'https://script.google.com/macros/s/AKfycbyBPYGNYSEEGkAGhIAzLBHXsEukhJR8QRfphmuR9pVdiOgt3V909tbePSuMuSFlCLUHJw/exec'

};


/* =====================================================
   GLOBAL
   ===================================================== */

let idToken = '';
let role = '';
let adminName = '';


/* =====================================================
   HELPER
   ===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function esc(value){

  return String(value ?? '').replace(
    /[&<>"']/g,

    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[char])

  );

}


/* =====================================================
   MESSAGE
   ===================================================== */

function clearMessage(){

  $('error').innerHTML = '';

}


function showError(message){

  $('error').innerHTML =
    '<div class="error">' +
    esc(message) +
    '</div>';

}


function showSuccess(message){

  $('error').innerHTML =
    '<div class="success">' +
    esc(message) +
    '</div>';

}


function showLoading(message='กำลังโหลด...'){

  $('error').innerHTML =
    '<div class="loading">' +
    esc(message) +
    '</div>';

}


/* =====================================================
   DATE
   ===================================================== */

/*
  ใช้เวลา Asia/Bangkok
  ไม่ใช้ toISOString() เพราะ toISOString()
  เป็น UTC และอาจทำให้วันที่คลาดเคลื่อน
*/

function getBangkokDate(){

  const now = new Date();

  const formatter =
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:'Asia/Bangkok',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    );

  return formatter.format(now);

}


/* =====================================================
   INIT
   ===================================================== */

async function init(){

  try{

    clearMessage();

    if(
      !CONFIG.LIFF_ID ||
      CONFIG.LIFF_ID.includes('PUT_')
    ){

      throw new Error(
        'ยังไม่ได้ตั้ง Admin LIFF ID'
      );

    }

    if(
      !CONFIG.API_URL ||
      CONFIG.API_URL.includes('PUT_')
    ){

      throw new Error(
        'ยังไม่ได้ตั้ง Apps Script Web App URL'
      );

    }


    /* -----------------------------------------------
       LIFF INIT
       ----------------------------------------------- */

    await liff.init({
      liffId: CONFIG.LIFF_ID
    });


    /* -----------------------------------------------
       LOGIN
       ----------------------------------------------- */

    if(!liff.isLoggedIn()){

      liff.login();

      return;

    }


    /* -----------------------------------------------
       ID TOKEN
       ----------------------------------------------- */

    idToken = liff.getIDToken();

    if(!idToken){

      throw new Error(
        'ไม่พบ LINE ID Token'
      );

    }


    /* -----------------------------------------------
       DASHBOARD
       ----------------------------------------------- */

    showLoading('กำลังตรวจสอบสิทธิ์ Admin...');

    const d =
      await api('DASHBOARD');


    /* -----------------------------------------------
       ROLE
       ----------------------------------------------- */

    role =
      String(d.role || '').toUpperCase();

    adminName =
      d.adminName ||
      d.name ||
      'Admin';


    $('role').textContent =
      role || 'ADMIN';

    $('name').textContent =
      adminName;


    /* -----------------------------------------------
       ADMIN BUTTON
       ----------------------------------------------- */

    if(role !== 'SUPER_ADMIN'){

      $('adminBtn').style.display =
        'none';

    }else{

      $('adminBtn').style.display =
        '';

    }


    /* -----------------------------------------------
       DASHBOARD DATA
       ----------------------------------------------- */

    renderDashboard(
      d.data || {}
    );


    clearMessage();


    /* -----------------------------------------------
       DEFAULT SECTION
       ----------------------------------------------- */

    show('attendance');


  }catch(error){

    console.error(
      'Admin Init Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   API
   ===================================================== */

async function api(
  action,
  payload = {}
){

  if(!CONFIG.API_URL){

    throw new Error(
      'ไม่พบ API URL'
    );

  }

  if(!idToken){

    throw new Error(
      'ไม่พบ LINE ID Token'
    );

  }


  const requestBody = {

    requestType:
      'admin',

    action:
      action,

    idToken:
      idToken,

    ...payload

  };


  const response =
    await fetch(
      CONFIG.API_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(
            requestBody
          )

      }
    );


  if(!response.ok){

    throw new Error(
      'Apps Script HTTP Error ' +
      response.status
    );

  }


  const text =
    await response.text();


  let data;

  try{

    data =
      JSON.parse(text);

  }catch(error){

    console.error(
      'Invalid JSON:',
      text
    );

    throw new Error(
      'Apps Script ส่งข้อมูลกลับมาไม่ใช่ JSON'
    );

  }


  if(!data.ok){

    throw new Error(
      data.error ||
      'API Error'
    );

  }


  return data;

}


/* =====================================================
   DASHBOARD
   ===================================================== */

function renderDashboard(data){

  $('active').textContent =
    data.activeEmployees ?? '-';

  $('working').textContent =
    data.workingToday ?? '-';

  $('missing').textContent =
    data.missingClockOut ?? '-';

  $('late').textContent =
    data.lateToday ?? '-';

}


/* =====================================================
   SECTION
   ===================================================== */

function show(id){

  document
    .querySelectorAll('section')
    .forEach(
      section =>
        section.classList.add('hidden')
    );


  const target =
    $(id);

  if(!target){

    showError(
      'ไม่พบ Section: ' + id
    );

    return;

  }


  target.classList.remove(
    'hidden'
  );


  /*
    โหลดข้อมูลเฉพาะตอนเปิด Section
  */

  if(id === 'attendance'){

    loadAttendance();

  }

  if(id === 'employees'){

    loadEmployees();

  }

  if(id === 'payroll'){

    clearMessage();

  }

  if(id === 'audit'){

    loadAudit();

  }

  if(
    id === 'admins' &&
    role === 'SUPER_ADMIN'
  ){

    loadAdmins();

  }

}


/* =====================================================
   ATTENDANCE
   ===================================================== */

async function loadAttendance(){

  try{

    showLoading(
      'กำลังโหลด Attendance...'
    );


    const date =
      $('attDate').value.trim();


    /*
      ถ้าไม่มีวันที่
      ไม่ส่ง date ไป
      ให้ Backend ใช้วันที่ปัจจุบัน
    */

    const payload =
      date
        ? {date:date}
        : {};


    const d =
      await api(
        'ATTENDANCE',
        payload
      );


    $('attTable').innerHTML =
      table(
        d.data || [],
        [
          'employeeId',
          'name',
          'type',
          'checkIn',
          'checkOut',
          'hours',
          'basePay',
          'otHours',
          'otPay',
          'status'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'Attendance Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   EMPLOYEES
   ===================================================== */

async function loadEmployees(){

  try{

    showLoading(
      'กำลังโหลด Employees...'
    );


    const d =
      await api(
        'EMPLOYEES'
      );


    $('empTable').innerHTML =
      table(
        d.data || [],
        [
          'employeeId',
          'name',
          'type',
          'position',
          'salaryRate',
          'positionAllowance',
          'attendanceBonus',
          'status'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'Employees Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   PAYROLL
   ===================================================== */

async function loadPayroll(){

  try{

    const period =
      $('period').value.trim();


    if(!period){

      showError(
        'กรุณาใส่ Payroll Period เช่น 2026-09-B'
      );

      return;

    }


    showLoading(
      'กำลังโหลด Payroll...'
    );


    const d =
      await api(
        'PAYROLL',
        {
          periodId:
            period
        }
      );


    let html =
      table(
        d.data || [],
        [
          'payrollId',
          'periodId',
          'employeeId',
          'name',
          'basePay',
          'otPay',
          'holidayPay',
          'positionAllowance',
          'attendanceBonus',
          'netPay',
          'status'
        ]
      );


    /*
      SUPER_ADMIN เท่านั้น
      จึงจะแสดง Approve / Paid
    */

    if(
      role === 'SUPER_ADMIN'
    ){

      html =
        '<div style="padding:12px">' +

        '<button ' +
        'class="action" ' +
        'onclick="approve()">' +
        'Approve Payroll' +
        '</button> ' +

        '<button ' +
        'class="action" ' +
        'onclick="paid()">' +
        'Mark as Paid' +
        '</button>' +

        '</div>' +

        html;

    }


    $('payTable').innerHTML =
      html;


    clearMessage();


  }catch(error){

    console.error(
      'Payroll Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   APPROVE PAYROLL
   ===================================================== */

async function approve(){

  try{

    const period =
      $('period').value.trim();


    if(!period){

      showError(
        'กรุณาระบุ Payroll Period'
      );

      return;

    }


    await api(
      'APPROVE_PAYROLL',
      {
        periodId:
          period,

        reason:
          'Admin Panel'
      }
    );


    showSuccess(
      'Approve Payroll สำเร็จ'
    );


    await loadPayroll();


  }catch(error){

    console.error(
      'Approve Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   MARK PAID
   ===================================================== */

async function paid(){

  try{

    const period =
      $('period').value.trim();


    if(!period){

      showError(
        'กรุณาระบุ Payroll Period'
      );

      return;

    }


    await api(
      'MARK_PAID',
      {
        periodId:
          period,

        paymentRef:
          '',

        reason:
          'Admin Panel'
      }
    );


    showSuccess(
      'Mark as Paid สำเร็จ'
    );


    await loadPayroll();


  }catch(error){

    console.error(
      'Mark Paid Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   AUDIT LOG
   ===================================================== */

async function loadAudit(){

  try{

    showLoading(
      'กำลังโหลด Audit Log...'
    );


    const d =
      await api(
        'AUDIT_LOG',
        {
          limit:100
        }
      );


    $('auditTable').innerHTML =
      table(
        d.data || [],
        [
          'timestamp',
          'adminId',
          'adminName',
          'action',
          'targetType',
          'targetId',
          'reason',
          'result'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'Audit Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   ADMINS
   ===================================================== */

async function loadAdmins(){

  try{

    if(
      role !== 'SUPER_ADMIN'
    ){

      showError(
        'เฉพาะ SUPER_ADMIN เท่านั้น'
      );

      return;

    }


    showLoading(
      'กำลังโหลด Admins...'
    );


    const d =
      await api(
        'LIST_ADMINS'
      );


    $('adminTable').innerHTML =
      table(
        d.data || [],
        [
          'adminId',
          'name',
          'lineUserId',
          'role',
          'status'
        ]
      );


    clearMessage();


  }catch(error){

    console.error(
      'Admins Error:',
      error
    );

    showError(
      error.message ||
      String(error)
    );

  }

}


/* =====================================================
   TABLE
   ===================================================== */

function table(
  rows,
  columns
){

  if(
    !Array.isArray(rows) ||
    rows.length === 0
  ){

    return `
      <div style="padding:16px">
        ไม่มีข้อมูล
      </div>
    `;

  }


  return `
    <table class="table">

      <thead>

        <tr>

          ${columns
            .map(
              column =>
                '<th>' +
                esc(column) +
                '</th>'
            )
            .join('')
          }

        </tr>

      </thead>

      <tbody>

        ${rows
          .map(
            row => `

              <tr>

                ${columns
                  .map(
                    column =>
                      '<td>' +
                      esc(row?.[column]) +
                      '</td>'
                  )
                  .join('')
                }

              </tr>

            `
          )
          .join('')
        }

      </tbody>

    </table>
  `;

}


/* =====================================================
   ERROR HANDLER
   ===================================================== */

function msg(error){

  console.error(
    error
  );

  showError(
    error?.message ||
    String(error)
  );

}


/* =====================================================
   START
   ===================================================== */

init();

</script>

</body>
</html>
